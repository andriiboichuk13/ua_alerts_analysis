[project]
name = "ua-alerts-analysis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
